name: Catalogue preview verification
on:
  push:
    branches: [agent/catalogue-v3]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare browser
        run: |
          npm install --no-save --package-lock=false playwright@1.65.0 @axe-core/playwright@4.14.0
          npx playwright install --with-deps chromium
      - name: Serve preview only
        run: python3 -m http.server 4183 --bind 127.0.0.1 --directory catalogue >/tmp/catalogue.log 2>&1 &
      - name: Verify catalogue interactions and capture screenshots
        run: node qa/catalogue.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalogue-preview-evidence
          path: qa-results/
          retention-days: 30
