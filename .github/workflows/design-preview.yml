name: Design samples screenshots
on:
  push:
    branches: [agent/design-samples-v2]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare browser
        run: |
          npm install --no-save --package-lock=false playwright@1.65.0 @axe-core/playwright@4.14.0
          npx playwright install --with-deps chromium
      - name: Serve design samples
        run: python3 -m http.server 4180 --bind 127.0.0.1 --directory concepts-v2 > /tmp/concepts.log 2>&1 &
      - name: Render desktop and phone previews
        run: node qa/render-concepts.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-previews-v2
          path: design-evidence/
          retention-days: 30
