name: Independent mobile verification
on:
  push:
    branches: [agent/verify-mobile-20261111]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    name: ${{ matrix.engine }} mobile browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 25aa986460556e49108473a3f4751b5d538d6b1a
          path: production
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 2e5fd3aaf2416d039a5a0385ece2c03509c57bf1
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.65.0 @axe-core/playwright@4.14.0
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Serve pinned versions
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory production > /tmp/d11-main.log 2>&1 &
          python3 -m http.server 4174 --bind 127.0.0.1 --directory candidate > /tmp/d11-fixed.log 2>&1 &
      - name: Test interaction, accessibility and layout
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
          LIVE_BASE: https://tsurezure.jerrylabs.dev/d11-2026-guide/
        run: node qa/mobile-check.mjs
      - name: Upload raw verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-${{ matrix.engine }}
          path: qa-results/
          retention-days: 14
