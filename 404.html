<!doctype html>
<html lang="zh-CN" data-theme="light" data-density="normal" data-fontscale="m">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>页面不存在 · 2026 双十一指南</title>
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="site.css?v=12">
<script>
(function(){try{var r=document.documentElement;var d=localStorage.getItem('d11_theme')||((window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light');r.dataset.theme=d;var n=localStorage.getItem('d11_density');if(n)r.dataset.density=n;var f=localStorage.getItem('d11_font');if(f)r.dataset.fontscale=f}catch(e){}})();
</script>
<style>
body{
  display:grid;place-items:center;min-height:100vh;min-height:100dvh;padding:24px;
  background:
    radial-gradient(70% 60% at 50% 0%,var(--brand-soft),transparent 68%),
    var(--bg);
}
.wrap{
  width:min(560px,100%);
  padding:38px 36px 32px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:var(--shadow);
  text-align:center;
  position:relative;overflow:hidden;
}
.wrap:before{
  content:"";position:absolute;inset:0 0 auto;height:3px;
  background:linear-gradient(90deg,var(--brand-2),var(--brand),transparent);
}
.brand{
  display:inline-flex;align-items:center;gap:8px;
  color:var(--ink-2);font-size:12px;font-weight:650;letter-spacing:.01em;
}
.brand:hover{color:var(--brand);text-decoration:none}
.brand .logo{
  width:24px;height:24px;border-radius:7px;
  background:linear-gradient(145deg,var(--brand-2),var(--brand));
  color:#fff;display:grid;place-items:center;
  font:800 11px/1 var(--sans);letter-spacing:-.04em;
}
.code{
  margin:22px 0 4px;
  font:800 clamp(66px,15vw,94px)/1 var(--mono);
  letter-spacing:-.07em;
  background:linear-gradient(145deg,var(--brand-2),var(--brand));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
h1{margin:10px 0 10px;font-size:21px;font-weight:750;letter-spacing:-.025em}
p{margin:0 auto;max-width:42ch;color:var(--ink-2);font-size:13.5px;line-height:1.8}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  padding:10px 17px;border-radius:10px;
  border:1px solid var(--line);background:var(--soft);
  color:var(--ink-2);font-size:12.5px;font-weight:650;
  transition:background .15s,border-color .15s,color .15s,transform .15s;
}
.btn:hover{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand);text-decoration:none;transform:translateY(-1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.hint{margin-top:24px;padding-top:16px;border-top:1px solid var(--line-2);font-size:10.5px;color:var(--ink-3)}
@media(max-width:480px){.wrap{padding:30px 22px 26px}.actions .btn{flex:1 1 100%}}
</style>
</head>
<body>
<main class="wrap">
  <a class="brand" href="index.html"><span class="logo" aria-hidden="true">11</span>双十一完全指南 · 2026</a>
  <div class="code" aria-hidden="true">404</div>
  <h1>这一页不在指南里</h1>
  <p>你要找的内容可能在别的文档，或已被更新。回首页用全文检索（按 <kbd>/</kbd>）更快。</p>
  <div class="actions">
    <a class="btn primary" href="index.html">回到首页仪表盘</a>
    <a class="btn" href="pages/p00.html">直接看一页速查</a>
  </div>
  <p class="hint">8 份文档 · 148 个可核验来源 · 单页离线可用</p>
</main>
</body>
</html>
